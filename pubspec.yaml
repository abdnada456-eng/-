name: iblagh_jordan
description: تطبيق إبلاغ الأردن - تطبيق احترافي للإبلاغ عن المشاكل العامة في المدن والشوارع
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  getx: ^4.6.5
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  cloud_firestore: ^4.13.0
  
  # Local Storage
  shared_preferences: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Design
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  
  # Camera & Images
  image_picker: ^1.0.4
  camera: ^0.10.5
  video_player: ^2.8.1
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Internationalization
  intl: ^0.19.0
  
  # Date & Time
  intl_datetime_pattern: ^2.0.1
  
  # Utils
  uuid: ^4.0.0
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  
  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # Charts & Analytics
  fl_chart: ^0.65.0
  
  # Permission Handling
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/localization/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
